name: Build Batches Tests

# Runs the whole unit test suite under tests/ on macOS and Windows, so the
# build tooling is verified on both platforms it is used on, not just the
# platform CI happens to run on by default. This covers cross-file shard
# pooling in build/build_batches.py and the schema gate in build/assemble.py
# (including the devices.json checks against build/output_schema.json),
# among the other test files in tests/. All tests operate on synthetic
# fixtures under a temporary directory; none of them touch the real vault
# import pipeline, any real staging data, or the real source shards.
# This file contains no em dashes by project policy.

on:
  push:
    paths:
      - 'build/build_batches.py'
      - 'build/assemble.py'
      - 'build/output_schema.json'
      - 'tests/**'
      - '.github/workflows/build-batches-tests.yml'
  pull_request:
    paths:
      - 'build/build_batches.py'
      - 'build/assemble.py'
      - 'build/output_schema.json'
      - 'tests/**'
      - '.github/workflows/build-batches-tests.yml'

# This workflow only checks out the repo and runs tests. It never writes to the
# repo and does not use the GITHUB_TOKEN beyond reading source for checkout, so
# read only on repo contents is the minimum it needs.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
