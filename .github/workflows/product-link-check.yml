name: Product link check

# Weekly, read-only monitor for productUrl/manufacturerUrl link health. Reads
# the published database from jsDelivr @main (the same CDN ref the app and
# website use) and writes a triage report under linkcheck/reports/. Never
# edits any database field. See linkcheck/ module docstrings for the
# dead-vs-transient classification rules. This file contains no em dashes by
# project policy.

on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-link-check
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r linkcheck/requirements.txt

      - name: Run link check
        run: python -m linkcheck.cli

      - name: Commit report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkcheck/reports/ linkcheck/state.json
          git diff --staged --quiet || git commit -m "linkcheck: weekly product/manufacturer link report $(date -u +%Y-W%V)"

      - name: Push
        run: git push origin HEAD:main
